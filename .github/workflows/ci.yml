name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Live tests are explicit, so this never calls Hugging Face; no token is needed or available here.
      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build --configuration Release 2>&1 | tee test-output.txt

      # Job logs need a GitHub login; annotations are public. Show each failing test as one.
      - name: Annotate test failures
        if: failure() && steps.test.outcome == 'failure'
        run: python3 .github/scripts/annotate-test-failures.py test-output.txt

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
